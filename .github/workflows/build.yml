
name: Build AUTHER Launcher V0.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ANDROID SDK SETUP
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          mkdir -p "$ANDROID_HOME"

          sdkmanager --sdk_root="$ANDROID_HOME" --version

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail

      - name: Install Android SDK Packages
        shell: bash
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          adb version
          echo "ANDROID SDK READY"

      # CHECK PROJECT
      - name: Check Android Project
        shell: bash
        run: |
          test -f gradlew
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

      # GRADLE
      - name: Grant Gradle Permission
        run: chmod +x gradlew

      - name: Build AUTHER Launcher Debug APK
        shell: bash
        run: |
          ./gradlew --no-daemon assembleDebug --stacktrace

      # UPLOAD APK
      - name: Upload AUTHER Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTHER-Launcher-V0.1
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
