
name: Build AUTHER Launcher V0.1 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/auther/launcher
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'AUTHER-Launcher'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.auther.launcher'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.auther.launcher'
                  minSdk 26
                  targetSdk 28
                  versionCode 1
                  versionName '0.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="AUTHER Launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/auther/launcher/MainActivity.java <<'EOF'
          package com.auther.launcher;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().getDecorView().setSystemUiVisibility(
                      5894 | 1024 | 512 | 4096
                  );

                  WebView web = new WebView(this);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  web.getSettings().setJavaScriptEnabled(true);
                  web.getSettings().setDomStorageEnabled(true);
                  web.loadUrl("file:///android_asset/index.html");
                  setContentView(web);
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="id">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>AUTHER Launcher</title>
          <style>
          *{box-sizing:border-box}
          body{margin:0;background:#101014;color:white;font-family:Arial}
          header{padding:18px;background:#19191f;display:flex;justify-content:space-between;align-items:center}
          header h2{color:#ff3434;margin:0}
          nav{display:flex;gap:8px;padding:12px;background:#19191f}
          button{background:#292930;color:white;border:1px solid #45454f;padding:12px;border-radius:8px;cursor:pointer}
          button.active,.play{background:#e52d35;border:0}
          main{padding:18px}
          .panel{background:#1c1c24;padding:18px;border-radius:12px;margin-bottom:14px}
          .hidden{display:none}
          .play{font-size:22px;padding:16px 55px;font-weight:bold}
          input,select{background:#292930;color:white;padding:12px;border:1px solid #555;border-radius:7px;width:100%;margin:7px 0}
          .item{background:#292930;padding:13px;margin:8px 0;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
          .item small{color:#aaa}
          progress{width:100%;height:17px;accent-color:#e52d35}
          h3{color:#ff5555}
          </style>
          </head>
          <body>
          <header><h2>AUTHER LAUNCHER</h2><span>V0.1</span></header>
          <nav>
          <button class="active" onclick="page('home',this)">Home</button>
          <button onclick="page('download',this)">Unduh</button>
          <button onclick="page('settings',this)">Setting</button>
          </nav>

          <main>
          <section id="home">
          <div class="panel" style="text-align:center;padding:55px 10px">
          <h1>AUTHER LAUNCHER</h1>
          <p>Minecraft Java Launcher</p>
          <button class="play" onclick="play()">PLAY</button>
          <p id="selected">Belum ada versi terpasang</p>
          </div>
          </section>

          <section id="download" class="hidden">
          <h2>Unduh</h2>
          <div class="panel">
          <button onclick="catalog('version')">Version & Loader</button>
          <button onclick="catalog('mods')">Mods & Modpack</button>
          <button onclick="catalog('resourcepacks')">Resource</button>
          <button onclick="catalog('shaders')">Shader</button>
          <button onclick="catalog('worlds')">Worlds</button>
          </div>
          <div id="catalog" class="panel">
          Pilih kategori untuk melihat katalog.
          </div>
          </section>

          <section id="settings" class="hidden">
          <h2>Setting</h2>
          <div class="panel">
          <h3>Renderer</h3>
          <select><option>MobileGlues</option><option>Default</option></select>
          <h3>Custom Controller</h3>
          <button onclick="alert('Pengaturan controller belum terhubung ke game.')">Configure Controller</button>
          <h3>Custom Mouse</h3>
          <label>Kecepatan mouse</label>
          <input type="range" min="1" max="100" value="50">
          <h3>RAM</h3>
          <select><option>1024 MB</option><option>2048 MB</option><option>4096 MB</option>
          </select>
          <h3>Change Background</h3>
          <input type="file" accept="image/*" onchange="background(event)">
          </div>
          </section>

          <section id="install" class="hidden">
          <div class="panel">
          <h2>Instalasi</h2>
          <h3 id="stage">Menunggu</h3>
          <progress id="bar" value="0" max="100"></progress>
          <p id="percent">0%</p>
          <div id="done" class="hidden">
          <h2>Version sudah selesai</h2>
          <button onclick="finish()">Selesai</button>
          </div>
          </div>
          </section>
          </main>

          <script>
          let current='home';
          function page(id,btn){
            document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
            if(btn)btn.classList.add('active');
            current=id;
          }
          function play(){
            alert('Mesin Minecraft Java belum terintegrasi. Tombol PLAY belum dapat menjalankan game.');
          }
          function background(e){
            const f=e.target.files[0];
            if(!f)return;
            const r=new FileReader();
            r.onload=()=>document.body.style.backgroundImage='url('+r.result+')';
            r.readAsDataURL(f);
          }
          async function catalog(type){
            const box=document.getElementById('catalog');
            box.innerHTML='<h3>'+type+'</h3>';
            if(type==='version'){
              box.innerHTML+='<p>Versi resmi Minecraft</p>';
              try{
                const r=await fetch('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json');
                const j=await r.json();
                j.versions.slice(0,40).forEach(v=>{
                  box.innerHTML+=`<div class="item"><span>${v.id}<br><small>${v.type}</small></span><button onclick="installItem('${v.id}','Version')">Instal</button></div>`;
                });
              }catch(e){box.innerHTML+='<p>Katalog versi gagal dimuat.</p>'}
              return;
            }
            if(type==='worlds'){
              box.innerHTML+='<p>Katalog world belum memiliki sumber unduhan yang terhubung.</p>';
              return;
            }
            const facets=type==='mods'?'project_type:mod':type==='resourcepacks'?'project_type:resourcepack':'project_type:shader';
            try{
              const r=await fetch('https://api.modrinth.com/v2/search?limit=30&facets='+encodeURIComponent('[["'+facets+'"]]'));
              const j=await r.json();
              j.hits.forEach(v=>{
                const name=document.createElement('div');
                name.className='item';
                const label=document.createElement('span');
                label.textContent=v.title;
                const btn=document.createElement('button');
                btn.textContent='Instal';
                btn.onclick=()=>installItem(v.project_id,type);
                name.append(label,btn);
                box.append(name);
              });
            }catch(e){box.innerHTML+='<p>Katalog gagal dimuat. Periksa koneksi internet.</p>'}
          }
          function installItem(id,type){
            alert('Item: '+id+'. Pengunduhan dan pemasangan ke folder Minecraft belum terintegrasi.');
          }
          function finish(){page('home',document.querySelector('nav button'))}
          </script>
          </body>
          </html>
          EOF

      - name: Build APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTHER-Launcher-V0.1
          path: app/build/outputs/apk/debug/app-debug.apk
