
name: Build AUTHER Launcher V0.1 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/auther/launcher
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AUTHER-Launcher"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.auther.launcher'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.auther.launcher'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '0.1'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#E53935</item>
                  <item name="android:statusBarColor">#080808</item>
                  <item name="android:navigationBarColor">#080808</item>
                  <item name="android:windowBackground">#080808</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application
                  android:theme="@style/AppTheme"
                  android:label="AUTHER Launcher"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/auther/launcher/MainActivity.java <<'EOF'
          package com.auther.launcher;

          import android.app.*;
          import android.os.*;
          import android.webkit.*;
          import android.content.*;
          import java.io.File;
          import java.net.URL;
          import java.util.HashSet;
          import java.util.Set;

          public class MainActivity extends Activity {
              WebView web;

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  getWindow().getDecorView().setSystemUiVisibility(
                      4 | 1024 | 4096 | 512
                  );

                  web = new WebView(this);
                  web.setBackgroundColor(0xFF080808);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  web.addJavascriptInterface(new Bridge(), "Android");
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              public class Bridge {
                  @JavascriptInterface
                  public void download(String address, String category,
                                       String filename) {
                      runOnUiThread(() -> {
                          try {
                              URL url = new URL(address);
                              String host = url.getHost();

                              boolean allowed =
                                  host.equals("cdn.modrinth.com") ||
                                  host.equals("modrinth.com") ||
                                  host.equals("piston-meta.mojang.com") ||
                                  host.equals("launchermeta.mojang.com");

                              if (!url.getProtocol().equals("https") ||
                                  !allowed) {
                                  send("URL unduhan tidak diizinkan.");
                                  return;
                              }

                              String safeCategory =
                                  category.replaceAll("[^a-zA-Z0-9_-]", "");

                              String safeName =
                                  filename.replaceAll("[^a-zA-Z0-9._-]", "_");

                              if (safeName.isEmpty()) {
                                  safeName = "download.bin";
                              }

                              File base = new File(
                                  getExternalFilesDir(null),
                                  ".minecraft/Versi/Belum dipilih/loader belum dipilih"
                              );

                              File folder = new File(base, safeCategory);
                              if (!folder.exists() && !folder.mkdirs()) {
                                  send("Folder penyimpanan gagal dibuat.");
                                  return;
                              }

                              DownloadManager.Request request =
                                  new DownloadManager.Request(
                                      android.net.Uri.parse(address)
                                  );

                              request.setTitle(safeName);
                              request.setDescription("AUTHER Launcher");
                              request.setNotificationVisibility(
                                  DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED
                              );
                              request.setDestinationUri(
                                  android.net.Uri.fromFile(
                                      new File(folder, safeName)
                                  )
                              );

                              DownloadManager manager =
                                  (DownloadManager)getSystemService(
                                      DOWNLOAD_SERVICE
                                  );

                              manager.enqueue(request);
                              send("Unduhan dimulai: " + safeName);

                          } catch(Exception e) {
                              send("Gagal memulai unduhan: " + e.getMessage());
                          }
                      });
                  }

                  @JavascriptInterface
                  public String getStoragePath() {
                      return new File(
                          getExternalFilesDir(null), ".minecraft"
                      ).getAbsolutePath();
                  }

                  void send(String message) {
                      final String safe = message
                          .replace("\\", "\\\\")
                          .replace("'", "\\'")
                          .replace("\n", " ");
                      web.evaluateJavascript(
                          "showMessage('" + safe + "')", null
                      );
                  }
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript(
                      "goBack()", null
                  );
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="id">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>AUTHER Launcher</title>
          <style>
          *{box-sizing:border-box}
          body{margin:0;background:#080808;color:white;font-family:Arial}
          header{color:#e53935;font-size:25px;font-weight:bold;padding:15px}
          main{padding:12px 4%;height:82vh;overflow:auto}
          button,select,input{
            background:#741313;color:white;border:0;border-radius:4px;
            padding:13px;margin:5px;font-size:15px
          }
          button{cursor:pointer}
          button:active{background:#e53935}
          .wide{width:98%;display:block;margin:12px 1%}
          .item{background:#171717;border:1px solid #501111;
            padding:12px;margin:8px 0;border-radius:5px}
          .item button{float:right}
          .nav{position:fixed;bottom:5px;left:2%;width:96%;
            display:flex;gap:5px}
          .nav button{flex:1;margin:0}
          .hidden{display:none}
          .muted{color:#aaa;font-size:13px}
          #message{color:#ff7777;padding:10px}
          </style>
          </head>
          <body>
          <header id="heading">AUTHER Launcher</header>
          <main>
          <section id="home">
            <h2>AUTHER LAUNCHER</h2>
            <button class="wide" onclick="show('download')">DOWNLOAD</button>
            <p>AUTHER Launcher V0.1</p>
          </section>

          <section id="download" class="hidden">
            <button class="wide" onclick="show('versions')">VERSION & LOADER</button>
            <button class="wide" onclick="show('mods')">MODS</button>
            <button class="wide" onclick="show('shaders')">SHADER</button>
            <button class="wide" onclick="show('worlds')">WORLDS</button>
            <button class="wide" onclick="show('installed')">INSTALLED</button>
          </section>

          <section id="versions" class="hidden">
            <button onclick="show('download')">Kembali</button>
            <h3>Version & Loader</h3>
            <select id="versionType" onchange="loadVersions()">
              <option value="release">Release</option>
              <option value="snapshot">Snapshot</option>
              <option value="old_beta">Beta</option>
              <option value="old_alpha">Alpha</option>
            </select>
            <div id="versionList">Memuat versi Mojang...</div>
            <h3>Loader</h3>
            <select id="loader">
              <option>Vanilla</option>
              <option>Fabric</option>
              <option>Forge</option>
              <option>OptiFine</option>
            </select>
            <div class="muted">
              Daftar versi diambil dari Mojang. Pengunduhan metadata
              belum memasang seluruh game atau loader.
            </div>
          </section>

          <section id="mods" class="hidden">
            <button onclick="show('download')">Kembali</button>
            <h3>Mods</h3>
            <input id="modSearch" placeholder="Telusuri mod">
            <button onclick="searchProjects('mod',0)">Cari</button>
            <select id="modLoader">
              <option value="">Semua loader</option>
              <option value="fabric">Fabric</option>
              <option value="forge">Forge</option>
              <option value="neoforge">NeoForge</option>
            </select>
            <div id="modList"></div>
            <button onclick="searchProjects('mod',page.mod+6)">Next</button>
            <button onclick="searchProjects('mod',0)">Remove</button>
          </section>

          <section id="shaders" class="hidden">
            <button onclick="show('download')">Kembali</button>
            <h3>Shader</h3>
            <input id="shaderSearch" placeholder="Telusuri shader">
            <button onclick="searchProjects('shader',0)">Cari</button>
            <div id="shaderList"></div>
            <button onclick="searchProjects('shader',page.shader+6)">Next</button>
            <button onclick="searchProjects('shader',0)">Remove</button>
          </section>

          <section id="worlds" class="hidden">
            <button onclick="show('download')">Kembali</button>
            <h3>Worlds</h3>
            <p>Impor dunia ZIP perlu pemilih file Android dan belum
            diaktifkan pada build ini.</p>
          </section>

          <section id="installed" class="hidden">
            <button onclick="show('download')">Kembali</button>
            <h3>Installed</h3>
            <p>Unduhan disimpan di:</p>
            <p id="path"></p>
            <p class="muted">Periksa folder melalui penyimpanan aplikasi.</p>
          </section>

          <section id="account" class="hidden">
            <h3>Account</h3>
            <p>Login belum diintegrasikan.</p>
          </section>

          <section id="setting" class="hidden">
            <h3>Setting</h3>
            <p>Pengaturan launcher.</p>
          </section>

          <div id="message"></div>
          </main>

          <div class="nav">
            <button onclick="show('home')">HOME</button>
            <button onclick="show('download')">DOWNLOAD</button>
            <button onclick="show('account')">ACCOUNT</button>
            <button onclick="show('setting')">SETTING</button>
          </div>

          <script>
          const page={mod:0,shader:0};
          let manifest=null;

          function show(id){
            document.querySelectorAll('main section').forEach(
              s=>s.classList.add('hidden')
            );
            document.getElementById(id).classList.remove('hidden');
            document.getElementById('heading').textContent =
              id==='home'?'AUTHER Launcher':id.toUpperCase();
            if(id==='versions')loadVersions();
            if(id==='mods')searchProjects('mod',0);
            if(id==='shaders')searchProjects('shader',0);
            if(id==='installed'){
              document.getElementById('path').textContent=
                Android.getStoragePath();
            }
          }

          function showMessage(s){
            document.getElementById('message').textContent=s;
          }

          function goBack(){show('download')}

          async function loadVersions(){
            const box=document.getElementById('versionList');
            box.textContent='Mengambil daftar versi Mojang...';
            try{
              if(!manifest){
                const r=await fetch(
                  'https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'
                );
                if(!r.ok)throw new Error('HTTP '+r.status);
                manifest=await r.json();
              }
              const type=document.getElementById('versionType').value;
              const list=manifest.versions.filter(v=>v.type===type);
              box.innerHTML='';
              list.forEach(v=>{
                const div=document.createElement('div');
                div.className='item';
                const name=document.createElement('b');
                name.textContent=v.id+' ('+v.releaseTime.slice(0,10)+')';
                const btn=document.createElement('button');
                btn.textContent='Unduh JSON';
                btn.onclick=()=>Android.download(
                  v.url,'versions',v.id+'.json'
                );
                div.append(name,btn);
                box.appendChild(div);
              });
              if(!list.length)box.textContent='Tidak ada versi pada kategori ini.';
            }catch(e){
              box.textContent='Gagal mengambil versi: '+e.message;
            }
          }

          async function searchProjects(type,offset){
            page[type]=offset;
            const isMod=type==='mod';
            const query=document.getElementById(
              isMod?'modSearch':'shaderSearch'
            ).value;
            const loader=isMod?
              document.getElementById('modLoader').value:'';
            const box=document.getElementById(
              isMod?'modList':'shaderList'
            );
            box.textContent='Mengambil katalog Modrinth...';

            try{
              const projectType=isMod?'mod':'shader';
              const facets=[[`project_type:${projectType}`]];
              if(loader)facets.push([`categories:${loader}`]);
              const params=new URLSearchParams({
                query:query,
                facets:JSON.stringify(facets),
                limit:'6',
                offset:String(offset)
              });
              const r=await fetch(
                'https://api.modrinth.com/v2/search?'+params
              );
              if(!r.ok)throw new Error('HTTP '+r.status);
              const data=await r.json();
              box.innerHTML='';
              data.hits.forEach(project=>{
                const div=document.createElement('div');
                div.className='item';
                const name=document.createElement('b');
                name.textContent=project.title;
                const desc=document.createElement('p');
                desc.className='muted';
                desc.textContent=project.description;
                const btn=document.createElement('button');
                btn.textContent='Instal';
                btn.onclick=()=>downloadProject(project);
                div.append(name,desc,btn);
                box.appendChild(div);
              });
              if(!data.hits.length)box.textContent='Tidak ada hasil.';
            }catch(e){
              box.textContent='Gagal mengambil katalog: '+e.message;
            }
          }

          async function downloadProject(project){
            try{
              const r=await fetch(
                'https://api.modrinth.com/v2/project/'+
                encodeURIComponent(project.project_id)+'/version'
              );
              if(!r.ok)throw new Error('HTTP '+r.status);
              const versions=await r.json();
              if(!versions.length)throw new Error('File belum tersedia.');

              const version=versions[0];
              const file=version.files.find(f=>f.primary)||version.files[0];
              if(!file)throw new Error('File unduhan tidak ditemukan.');

              const category=project.project_type==='shader'
                ?'shaderpacks':'mods';

              Android.download(file.url,category,file.filename);
            }catch(e){
              showMessage('Gagal: '+e.message);
            }
          }

          show('home');
          </script>
          </body>
          </html>
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTHER-LAUNCHER-V0.1
          path: app/build/outputs/apk/debug/app-debug.apk
