
name: Build AUTHER Launcher V0.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ANDROID SDK
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "$SDK_PATH/platform-tools" >> "$GITHUB_PATH"
          test -d "$SDK_PATH"

      - name: Locate SDK Manager
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept SDK Licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail

      - name: Install SDK Packages
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify SDK
        run: |
          adb version
          test -d "$ANDROID_HOME/platforms/android-35"
          echo "ANDROID SDK READY"

      # FIND PROJECT AUTOMATICALLY
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "Mencari Gradle project..."

          GRADLEW=$(find . -type f -name gradlew \
            -not -path './.git/*' -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew tidak ditemukan."
            echo "Project Android atau Gradle Wrapper belum tersedia."
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="${GRADLEW%/gradlew}"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan: $PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle" || \
          test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" || \
          test -f "$PROJECT_DIR/app/build.gradle.kts"

      # BUILD
      - name: Grant Gradle Permission
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Build AUTHER Launcher
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      # UPLOAD APK
      - name: Upload AUTHER APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTHER-Launcher-V0.1
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
