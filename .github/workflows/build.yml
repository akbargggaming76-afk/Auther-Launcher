
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUTHER Launcher</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f0eff7;
    color: #292b3a;
}

header {
    height: 70px;
    display: flex;
    align-items: center;
    padding: 0 25px;
    background: #f8f7fc;
    border-bottom: 1px solid #dedde6;
    gap: 25px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 2px;
    flex: 1;
}

.toolbar {
    display: flex;
    gap: 15px;
}

.toolbar button {
    background: transparent;
    color: #353747;
    font-size: 23px;
    padding: 8px;
}

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
}

main {
    padding: 20px;
    min-height: calc(100vh - 70px);
}

.dashboard {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    min-height: 470px;
}

.panel {
    background: #fff;
    border-radius: 30px;
    padding: 25px;
}

.account {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.plus {
    font-size: 85px;
    font-weight: 300;
    margin-bottom: 15px;
}

.account h2 {
    font-size: 23px;
}

.game {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.game-title {
    font-size: 23px;
    font-weight: bold;
}

.grass {
    font-size: 55px;
    text-align: center;
    margin: 25px;
}

.status {
    text-align: center;
    color: #77798b;
    font-size: 17px;
}

.launch {
    width: 100%;
    background: #485f99;
    color: white;
    border-radius: 40px;
    padding: 20px;
    font-size: 19px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.version-list {
    display: grid;
    gap: 15px;
}

.version-item {
    padding: 20px;
    border-radius: 20px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.version-item button {
    background: #485f99;
    color: white;
    padding: 12px 22px;
    border-radius: 25px;
}

.back {
    background: #485f99;
    color: white;
    padding: 13px 25px;
    border-radius: 25px;
    margin-top: 20px;
}

.setting-card {
    background: white;
    padding: 25px;
    border-radius: 20px;
    margin-bottom: 15px;
}

select {
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #ccc;
}

@media(max-width:650px) {
    header {
        padding: 0 12px;
    }

    .dashboard {
        grid-template-columns: 1fr;
    }

    .panel {
        min-height: 300px;
    }

    .toolbar {
        gap: 3px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Ⓐ AUTHER</div>

    <div class="toolbar">
        <button onclick="openPage('home')" title="Home">⌂</button>
        <button onclick="openPage('versions')" title="Versi">▣</button>
        <button onclick="openPage('mods')" title="Mod">◇</button>
        <button onclick="openPage('settings')" title="Pengaturan">⚙</button>
    </div>
</header>

<main>

<!-- HOME -->
<section id="home" class="page active">

    <div class="dashboard">

        <div class="panel account">

            <div class="plus">+</div>

            <h2>Tambahkan Akun</h2>

            <p>Belum ada akun yang ditambahkan</p>

            <button class="launch"
                onclick="addAccount()">
                TAMBAHKAN AKUN
            </button>

        </div>

        <div class="panel game">

            <div>
                <div class="game-title">
                    MINECRAFT JAVA
                </div>

                <div class="grass">🟩</div>

                <div class="status" id="gameStatus">
                    Tidak ada versi yang terinstal
                </div>
            </div>

            <div>
                <button class="launch"
                    onclick="launchGame()">
                    LUNCURKAN
                </button>
            </div>

        </div>

    </div>

</section>

<!-- VERSION MANAGER -->
<section id="versions" class="page">

    <h2>DAFTAR VERSI</h2>

    <p>Versi Minecraft Java</p>

    <div class="version-list">

        <div class="version-item">
            <b>Minecraft 1.21.4</b>
            <button onclick="selectVersion('1.21.4')">
                PILIH
            </button>
        </div>

        <div class="version-item">
            <b>Minecraft 1.20.1</b>
            <button onclick="selectVersion('1.20.1')">
                PILIH
            </button>
        </div>

        <div class="version-item">
            <b>Minecraft 1.19.4</b>
            <button onclick="selectVersion('1.19.4')">
                PILIH
            </button>
        </div>

    </div>

    <button class="back" onclick="openPage('home')">
        KEMBALI
    </button>

</section>

<!-- MODS -->
<section id="mods" class="page">

    <h2>MOD & RESOURCE PACK</h2>

    <div class="setting-card">
        <h3>Mod Manager</h3>
        <p>Pengelolaan mod Minecraft.</p>
    </div>

    <div class="setting-card">
        <h3>Resource Pack</h3>
        <p>Pengelolaan resource pack Minecraft.</p>
    </div>

    <button class="back" onclick="openPage('home')">
        KEMBALI
    </button>

</section>

<!-- SETTINGS -->
<section id="settings" class="page">

    <h2>PENGATURAN</h2>

    <div class="setting-card">
        <h3>RAM</h3>

        <select id="ram">
            <option>1024 MB</option>
            <option>2048 MB</option>
            <option>3072 MB</option>
            <option>4096 MB</option>
        </select>
    </div>

    <div class="setting-card">
        <h3>Java Runtime</h3>
        <p>Runtime Java Android belum terintegrasi.</p>
    </div>

    <button class="back" onclick="openPage('home')">
        KEMBALI
    </button>

</section>

</main>

<script>

let selectedVersion = "";

function openPage(page) {

    document.querySelectorAll(".page").forEach(p => {
        p.classList.remove("active");
    });

    document.getElementById(page).classList.add("active");

}

function selectVersion(version) {

    selectedVersion = version;

    document.getElementById("gameStatus").innerText =
        "Minecraft Java " + version + " (dipilih)";

    alert("Versi " + version + " dipilih.");

    openPage("home");

}

function addAccount() {

    alert("Sistem akun belum terintegrasi.");

}

function launchGame() {

    if (!selectedVersion) {
        alert("Silakan pilih versi Minecraft terlebih dahulu.");
        return;
    }

    alert("Runtime Minecraft Java belum terintegrasi.");

}

</script>

</body>
</html>
