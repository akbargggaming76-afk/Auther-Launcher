
name: AUTHER Launcher Build

'on':
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build AUTHER Launcher V0.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create AUTHER Android Project
        run: |
          mkdir -p app/src/main/java/com/auther/launcher
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'AUTHER'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.auther.launcher'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.auther.launcher'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '0.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="AUTHER Launcher"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/auther/launcher/MainActivity.java <<'EOF'
          package com.auther.launcher;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.DownloadListener;
          import android.content.Intent;
          import android.net.Uri;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  getWindow().setStatusBarColor(0xff11131b);
                  getWindow().setNavigationBarColor(0xff11131b);

                  WebView web = new WebView(this);
                  web.setBackgroundColor(0xff11131b);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());

                  web.setDownloadListener((url, agent, disposition,
                                            mime, length) -> {
                      try {
                          Intent intent = new Intent(
                              Intent.ACTION_VIEW, Uri.parse(url));
                          startActivity(intent);
                      } catch (Exception e) {
                      }
                  });

                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="id">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>AUTHER Launcher</title>
          <style>
          *{box-sizing:border-box}
          body{margin:0;background:#11131b;color:white;font-family:Arial}
          .app{height:100dvh;padding:18px;display:grid;
          grid-template-columns:0.85fr 1.15fr;grid-template-rows:1fr auto;gap:15px}
          .left{display:flex;flex-direction:column;gap:15px}
          .profile{display:flex;align-items:center;gap:12px}
          .avatar{width:75px;height:75px;border:3px solid #dc555b;
          border-radius:14px;display:grid;place-items:center;background:#292e3d}
          .avatar img{width:100%;height:100%;object-fit:cover;border-radius:10px}
          .name{font-size:24px;font-weight:bold}
          .import{flex:1;background:#292e3d;border:2px solid #ed984e;
          border-radius:16px;color:white;font-weight:bold;font-size:17px}
          .menu{border:2px solid #78b85c;border-radius:16px;
          background:#202431;display:grid;grid-template-rows:repeat(4,1fr);overflow:hidden}
          button{cursor:pointer}
          .menu button{background:transparent;border:0;border-bottom:1px solid #465b40;
          color:white;text-align:left;padding:15px;font-size:18px;font-weight:bold}
          .menu button:last-child{border:0}
          .playbar{grid-column:1/-1;text-align:center}
          .play{width:70%;height:55px;border:2px solid #555;border-radius:40px;
          background:#050505;color:white;font-size:20px;font-weight:bold}
          .screen{position:fixed;inset:0;background:#11131b;padding:18px;
          display:none;overflow:auto}
          .screen.show{display:block}
          .top{display:flex;align-items:center;justify-content:space-between;
          margin-bottom:15px}
          .top button{background:#303647;color:white;border:0;border-radius:9px;padding:10px}
          input{background:#252b39;color:white;border:1px solid #6574ff;
          border-radius:9px;padding:12px;width:100%;font-size:16px}
          .item{background:#252b39;padding:13px;border-radius:12px;
          margin:10px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}
          .item small{display:block;color:#b8bdca;margin-top:5px}
          .download{background:#78b85c;color:#101510;border:0;
          padding:10px;border-radius:9px;font-weight:bold}
          .muted{color:#aeb4c4;font-size:13px}
          @media(max-width:500px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;overflow:auto}.left{min-height:170px}.menu{min-height:230px}.playbar{grid-column:1}.play{width:100%}}
          </style>
          </head>
          <body>
          <main class="app">
            <section class="left">
              <div class="profile">
                <label class="avatar">
                  <span id="placeholder">A</span>
                  <img id="avatar" hidden>
                  <input id="skin" type="file" accept="image/*" hidden>
                </label>
                <div>
                  <div class="name">AUTHER</div>
                  <div class="muted">Minecraft Java Edition</div>
                </div>
              </div>
              <button class="import" onclick="document.getElementById('skin').click()">
                ▧ IMPOR SKIN
              </button>
            </section>
            <section class="menu">
              <button onclick="openCatalog('mod')">Mods　›</button>
              <button onclick="openVersions()">Versi Minecraft　›</button>
              <button onclick="openCatalog('resourcepack')">Resource Pack　›</button>
              <button onclick="openCatalog('shader')">Shader　›</button>
            </section>
            <footer class="playbar">
              <button class="play" onclick="alert('Minecraft Java Runtime belum terintegrasi.')">▶ PLAY</button>
            </footer>
          </main>

          <section class="screen" id="catalog">
            <div class="top">
              <h2 id="heading">Download Center</h2>
              <button onclick="closeScreen()">KEMBALI</button>
            </div>
            <input id="search" placeholder="Cari konten..." onkeydown="if(event.key==='Enter')searchCatalog()">
            <p class="muted" id="info">Katalog dari Modrinth. Pilih konten untuk melihat unduhan.</p>
            <div id="results"></div>
          </section>

          <script>
          let category='mod';

          function closeScreen(){
            document.getElementById('catalog').classList.remove('show');
          }

          async function openCatalog(type){
            category=type;
            document.getElementById('catalog').classList.add('show');
            document.getElementById('heading').textContent=
              type==='mod'?'Mods':type==='resourcepack'?'Resource Pack':'Shader';
            document.getElementById('search').value='';
            await searchCatalog();
          }

          async function searchCatalog(){
            const query=document.getElementById('search').value;
            const results=document.getElementById('results');
            const info=document.getElementById('info');
            results.innerHTML='';
            info.textContent='Memuat katalog...';

            try{
              const url='https://api.modrinth.com/v2/search?query='+
                encodeURIComponent(query)+
                '&facets='+encodeURIComponent(JSON.stringify([['project_type:'+category]]))+
                '&limit=20';

              const response=await fetch(url);
              if(!response.ok)throw new Error('Katalog tidak tersedia');
              const data=await response.json();

              info.textContent=data.hits.length+' hasil ditemukan';

              data.hits.forEach(project=>{
                const item=document.createElement('div');
                item.className='item';

                const details=document.createElement('div');
                const title=document.createElement('strong');
                title.textContent=project.title;

                const desc=document.createElement('small');
                desc.textContent=project.description;

                details.append(title,desc);

                const download=document.createElement('button');
                download.className='download';
                download.textContent='BUKA';

                download.onclick=()=>{
                  window.location.href='https://modrinth.com/'+
                    category+'/'+project.slug;
                };

                item.append(details,download);
                results.appendChild(item);
              });

              if(!data.hits.length)info.textContent='Tidak ada hasil.';
            }catch(error){
              info.textContent='Gagal memuat katalog. Periksa koneksi internet.';
            }
          }

          async function openVersions(){
            document.getElementById('catalog').classList.add('show');
            document.getElementById('heading').textContent='Versi Minecraft';
            const results=document.getElementById('results');
            const info=document.getElementById('info');
            results.innerHTML='';
            info.textContent='Memuat daftar versi resmi...';

            try{
              const response=await fetch(
                'https://piston-meta.mojang.com/mc/game/version_manifest_v2.json');
              if(!response.ok)throw new Error('Gagal');
              const data=await response.json();
              info.textContent='Daftar versi resmi Minecraft Java';

              data.versions.filter(v=>v.type==='release').slice(0,30)
              .forEach(v=>{
                const item=document.createElement('div');
                item.className='item';

                const details=document.createElement('div');
                const title=document.createElement('strong');
                title.textContent=v.id;

                const desc=document.createElement('small');
                desc.textContent='Minecraft Java Release';

                details.append(title,desc);

                const button=document.createElement('button');
                button.className='download';
                button.textContent='PILIH';
                button.onclick=()=>{
                  info.textContent='Versi '+v.id+
                    ' dipilih. Pengunduh dan pemasang game belum terintegrasi.';
                };

                item.append(details,button);
                results.appendChild(item);
              });
            }catch(error){
              info.textContent='Gagal memuat daftar versi. Periksa internet.';
            }
          }

          document.getElementById('skin').addEventListener('change',e=>{
            const file=e.target.files[0];
            if(!file)return;
            const img=document.getElementById('avatar');
            img.src=URL.createObjectURL(file);
            img.hidden=false;
            document.getElementById('placeholder').hidden=true;
          });
          </script>
          </body>
          </html>
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTHER-LAUNCHER-V0.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
