
name: AUTHER Launcher Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    name: Build AUTHER APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          if [ ! -f settings.gradle ]; then
            echo "ERROR: settings.gradle tidak ditemukan di root repository"
            exit 1
          fi
          gradle --version
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTHER-LAUNCHER-V0.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
