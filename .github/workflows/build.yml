
name: AUTHER Launcher Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build AUTHER Launcher V0.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/auther/launcher

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'AUTHER'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.auther.launcher'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.auther.launcher'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '0.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="AUTHER Launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="sensorLandscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/auther/launcher/MainActivity.java <<'EOF'
          package com.auther.launcher;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.*;

          public class MainActivity extends Activity {

              LinearLayout root;

              TextView makeText(String value, int size) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(Color.WHITE);
                  return t;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.rgb(20,22,31));
                  getWindow().setNavigationBarColor(Color.rgb(20,22,31));
                  home();
              }

              void home() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24,20,24,20);
                  root.setBackgroundColor(Color.rgb(20,22,31));

                  TextView logo = makeText("Ⓐ AUTHER",28);
                  root.addView(logo);

                  TextView subtitle = makeText(
                      "Minecraft Java Edition",15);
                  root.addView(subtitle);

                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);

                  LinearLayout account = panel(
                      "AKUN","Tambahkan akun");
                  LinearLayout version = panel(
                      "VERSI MINECRAFT",
                      "Belum ada versi terpasang");

                  row.addView(account,
                      new LinearLayout.LayoutParams(0,0,1));
                  row.addView(version,
                      new LinearLayout.LayoutParams(0,0,1));

                  root.addView(row,
                      new LinearLayout.LayoutParams(-1,0,1));

                  Button play = new Button(this);
                  play.setText("LUNCURKAN");
                  play.setOnClickListener(v ->
                      Toast.makeText(this,
                          "Runtime Minecraft belum terintegrasi",
                          Toast.LENGTH_LONG).show());

                  root.addView(play,
                      new LinearLayout.LayoutParams(-1,60));

                  setContentView(root);
              }

              LinearLayout panel(String title, String description) {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setGravity(Gravity.CENTER);
                  box.setPadding(15,15,15,15);
                  box.setBackgroundColor(Color.rgb(42,46,62));

                  LinearLayout.LayoutParams params =
                      new LinearLayout.LayoutParams(0,-1,1);
                  params.setMargins(7,25,7,25);
                  box.setLayoutParams(params);

                  TextView heading = makeText(title,20);
                  TextView body = makeText(description,14);

                  box.addView(heading);
                  box.addView(body);

                  return box;
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTHER-LAUNCHER-V0.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
