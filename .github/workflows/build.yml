
name: Build AUTHER Launcher V0.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/auther/launcher
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AUTHER-Launcher"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.auther.launcher'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.auther.launcher'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '0.1'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FF3030</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#101010</item>
                  <item name="android:navigationBarColor">#101010</item>
                  <item name="android:windowBackground">#101010</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@style/AppTheme"
                  android:label="AUTHER Launcher"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/auther/launcher/MainActivity.java <<'EOF'
          package com.auther.launcher;

          import android.app.*;
          import android.os.*;
          import android.graphics.Color;
          import android.view.*;
          import android.widget.*;
          import android.content.*;
          import android.graphics.Typeface;

          public class MainActivity extends Activity {
              LinearLayout root, content;
              android.content.SharedPreferences prefs;

              int bg = Color.rgb(16,16,16);
              int red = Color.rgb(210,35,35);
              int white = Color.WHITE;
              int gray = Color.rgb(160,160,160);

              String[] resolutions = {"50","60","75","85","90","100"};
              String[] descriptions = {
                  "Sangat High dan cukup Buram",
                  "High dan Buram sedang",
                  "Sangat sedang",
                  "Sedang",
                  "Cukup bagus",
                  "Bagus dan HD"
              };

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );
                  prefs = getSharedPreferences("auther_settings", MODE_PRIVATE);
                  showHome();
              }

              TextView text(String value, int size) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextColor(white);
                  t.setTextSize(size);
                  t.setPadding(12,10,12,10);
                  return t;
              }

              void setup(String title) {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(bg);

                  TextView heading = text(title,23);
                  heading.setTypeface(null,Typeface.BOLD);
                  heading.setTextColor(red);
                  root.addView(heading);

                  ScrollView scroll = new ScrollView(this);
                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(20,12,20,20);
                  scroll.addView(content);
                  root.addView(scroll,new LinearLayout.LayoutParams(
                      -1,0,1
                  ));

                  LinearLayout nav = new LinearLayout(this);
                  nav.setOrientation(LinearLayout.HORIZONTAL);
                  addNav(nav,"Home",()->showHome());
                  addNav(nav,"Download",()->showDownload());
                  addNav(nav,"Account",()->showAccount());
                  addNav(nav,"Setting",()->showSettings());
                  root.addView(nav);
                  setContentView(root);
              }

              void addNav(LinearLayout parent,String label,Runnable action) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextColor(white);
                  b.setBackgroundTintList(
                      android.content.res.ColorStateList.valueOf(red)
                  );
                  parent.addView(b,new LinearLayout.LayoutParams(0,55,1));
                  b.setOnClickListener(v->action.run());
              }

              void addText(String s,int size) {
                  content.addView(text(s,size));
              }

              void addButton(String label,Runnable action) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextColor(white);
                  b.setBackgroundTintList(
                      android.content.res.ColorStateList.valueOf(red)
                  );
                  content.addView(b);
                  b.setOnClickListener(v->action.run());
              }

              void showHome() {
                  setup("AUTHER LAUNCHER");
                  content.setGravity(Gravity.CENTER);
                  addText("Minecraft Java Launcher",20);
                  addButton("PLAY",()->new AlertDialog.Builder(this)
                      .setMessage("Minecraft Java runtime belum terintegrasi.")
                      .setPositiveButton("OK",null).show());
                  addText("V0.1",14);
              }

              void showDownload() {
                  setup("Download");
                  addButton("Version & Loader",()->message("Katalog versi belum terhubung."));
                  addButton("Mods",()->message("Katalog mod belum terhubung."));
                  addButton("Shader",()->message("Katalog shader belum terhubung."));
                  addButton("Worlds",()->message("Impor dunia belum tersedia."));
                  addButton("Installed",()->message("Belum ada daftar instalasi."));
              }

              void showAccount() {
                  setup("Account");
                  addText("Pilih jenis akun",18);
                  addButton("Offline",()->message("Login Offline belum diintegrasikan."));
                  addButton("Ely.by",()->message("Login Ely.by belum diintegrasikan."));
                  addButton("Microsoft",()->message("Login Microsoft belum diintegrasikan."));
              }

              void showSettings() {
                  setup("Setting");
                  addButton("Renderer Cuality",()->showQuality());
                  addButton("Custome controller",()->message("Pengaturan controller belum terhubung ke game."));
                  addButton("mouse setting",()->message("Pengaturan mouse belum terhubung ke game."));
                  addButton("Background",()->message("Pengaturan background."));
                  addButton("Tentang",()->showAbout());
              }

              void showQuality() {
                  setup("Cuality");

                  addText("Runtime",18);
                  String[] runtimes = {"25","21","17","8"};
                  String selectedRuntime = prefs.getString("runtime","17");

                  RadioGroup runtimeGroup = new RadioGroup(this);
                  runtimeGroup.setOrientation(RadioGroup.HORIZONTAL);

                  for(String r : runtimes) {
                      RadioButton rb = new RadioButton(this);
                      rb.setText(r);
                      rb.setTextColor(white);
                      rb.setButtonTintList(
                          android.content.res.ColorStateList.valueOf(red)
                      );
                      runtimeGroup.addView(rb);
                      if(r.equals(selectedRuntime)) rb.setChecked(true);
                  }

                  runtimeGroup.setOnCheckedChangeListener((g,id)->{
                      RadioButton selected = findViewById(id);
                      if(selected != null)
                          prefs.edit().putString(
                              "runtime",selected.getText().toString()
                          ).apply();
                  });
                  content.addView(runtimeGroup);

                  addText("Memory",18);

                  int[] memoryValues = {140,1024,1045,2042};
                  String[] memoryLabels = {"1gb","2gb","3gb","4gb"};
                  int savedMemory = prefs.getInt("memory",1024);

                  TextView memoryNumber = text(
                      String.valueOf(savedMemory),18
                  );
                  content.addView(memoryNumber);

                  SeekBar memorySlider = new SeekBar(this);
                  memorySlider.setMax(3);
                  int initial = 1;
                  for(int i=0;i<memoryValues.length;i++)
                      if(memoryValues[i] == savedMemory) initial=i;
                  memorySlider.setProgress(initial);
                  content.addView(memorySlider);

                  TextView memoryChoices = text(
                      "1gb       2gb       3gb       4gb",14
                  );
                  content.addView(memoryChoices);

                  memorySlider.setOnSeekBarChangeListener(
                      new SeekBar.OnSeekBarChangeListener() {
                          public void onProgressChanged(SeekBar s,int p,boolean u) {
                              memoryNumber.setText(
                                  String.valueOf(memoryValues[p])
                              );
                              prefs.edit().putInt("memory",memoryValues[p]).apply();
                          }
                          public void onStartTrackingTouch(SeekBar s) {}
                          public void onStopTrackingTouch(SeekBar s) {}
                      }
                  );

                  addText("Tampilan resolusi",18);

                  int savedResolution = prefs.getInt("resolution",100);
                  int index = 5;
                  for(int i=0;i<resolutions.length;i++)
                      if(Integer.parseInt(resolutions[i]) == savedResolution)
                          index=i;

                  TextView description = text(descriptions[index],16);
                  content.addView(description);

                  SeekBar resolutionSlider = new SeekBar(this);
                  resolutionSlider.setMax(5);
                  resolutionSlider.setProgress(index);
                  content.addView(resolutionSlider);

                  TextView choices = text(
                      "50       60       75       85       90       100",16
                  );
                  content.addView(choices);

                  resolutionSlider.setOnSeekBarChangeListener(
                      new SeekBar.OnSeekBarChangeListener() {
                          public void onProgressChanged(SeekBar s,int p,boolean u) {
                              description.setText(descriptions[p]);
                              prefs.edit().putInt(
                                  "resolution",
                                  Integer.parseInt(resolutions[p])
                              ).apply();
                          }
                          public void onStartTrackingTouch(SeekBar s) {}
                          public void onStopTrackingTouch(SeekBar s) {}
                      }
                  );
              }

              void showAbout() {
                  setup("Tentang");
                  addText("v0.1     cek pembaruan",17);
                  addText("Dibuat oleh",17);
                  addText("YuzeeCraft",17);
                  addButton("Cek pembaruan",()->{
                      Intent i = new Intent(Intent.ACTION_VIEW,
                          android.net.Uri.parse(
                              "https://whatsapp.com/channel/0029VbEhRzO4IBhBLF0U5K0t"
                          ));
                      startActivity(i);
                  });
              }

              void message(String msg) {
                  new AlertDialog.Builder(this)
                      .setMessage(msg)
                      .setPositiveButton("OK",null).show();
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload AUTHER Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTHER-LAUNCHER-V0.1
          path: app/build/outputs/apk/debug/app-debug.apk
