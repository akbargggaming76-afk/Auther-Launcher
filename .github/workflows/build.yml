
name: AUTHER Launcher Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build AUTHER Launcher V0.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/auther/launcher

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AUTHERLauncher"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.auther.launcher'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.auther.launcher'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '0.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="AUTHER Launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/auther/launcher/MainActivity.java <<'EOF'
          package com.auther.launcher;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.view.View;
          import android.widget.FrameLayout;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );

                  WebView web = new WebView(this);
                  web.setBackgroundColor(0xFF101116);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  web.loadUrl("file:///android_asset/index.html");
                  setContentView(web);
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="id">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>AUTHER Launcher</title>
          <style>
          *{box-sizing:border-box}
          body{margin:0;background:#101116;color:white;font-family:Arial}
          header{padding:18px;background:#1b1d25;display:flex;justify-content:space-between}
          .logo{font-size:25px;font-weight:bold;color:#ff4949}
          main{padding:18px;max-width:900px;margin:auto}
          .profile,.panel,.menu{background:#20232d;border-radius:13px;padding:16px}
          .profile{display:flex;align-items:center;gap:15px}
          .skin{width:75px;height:75px;background:#a94c37;border:3px solid #ff5148;border-radius:10px;display:grid;place-items:center;font-size:30px}
          button{background:#ff5048;color:white;border:0;padding:12px;border-radius:8px;font-weight:bold}
          .orange{background:#e68a36}
          .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
          .menu{text-align:center;cursor:pointer}
          .menu b{display:block;margin-top:8px}
          .play{width:100%;background:#08090d;border:2px solid #ff4949;margin-top:18px;font-size:23px;padding:17px}
          .panel{display:none;margin-top:15px}
          .panel.active{display:block}
          .item{background:#303440;padding:13px;margin:10px 0;border-radius:9px;display:flex;justify-content:space-between;align-items:center;gap:10px}
          .back{background:#454957;margin-bottom:12px}
          label{display:block;margin:15px 0 7px}
          input,select{width:100%;padding:9px;accent-color:#ff5148}
          select{background:#303440;color:white;border-radius:8px}
          .note{color:#aaa;font-size:12px}
          .controller{height:230px;background:#15171e;position:relative;border-radius:12px;overflow:hidden;margin:12px 0}
          .joy{position:absolute;left:25px;bottom:25px;width:90px;height:90px;border:3px solid #ff5148;border-radius:50%;display:grid;place-items:center}
          .stick{width:38px;height:38px;background:#ff5148;border-radius:50%}
          .ctrl{position:absolute;width:48px;height:48px;border-radius:50%;background:#267bd0;display:grid;place-items:center;touch-action:none}
          .jump{right:25px;bottom:25px}
          .attack{right:85px;bottom:85px;background:#d34848}
          .sneak{right:105px;bottom:20px;background:#777}
          </style>
          </head>
          <body>
          <header><div class="logo">AUTHER</div><div>V0.1</div></header>
          <main>
          <div id="home">
            <div class="profile">
              <div class="skin" id="skin">👤</div>
              <div>
                <b>PLAYER SKIN</b><br><br>
                <button class="orange" onclick="document.getElementById('skinfile').click()">IMPORT SKIN</button>
                <input hidden type="file" id="skinfile" accept="image/*" onchange="loadSkin(event)">
              </div>
            </div>
            <div class="grid">
              <div class="menu" onclick="openPage('mods')">🧩<b>Mods</b></div>
              <div class="menu" onclick="openPage('versions')">📦<b>Versi</b></div>
              <div class="menu" onclick="openPage('resources')">🎨<b>Resource Pack</b></div>
              <div class="menu" onclick="openPage('shaders')">✨<b>Shader</b></div>
              <div class="menu" onclick="openPage('settings')">⚙️<b>Settings</b></div>
              <div class="menu" onclick="openPage('controller')">🎮<b>Controller</b></div>
            </div>
            <button class="play" onclick="alert('Minecraft Java belum terhubung ke runtime launcher.')">▶ PLAY</button>
          </div>

          <div id="mods" class="panel">
            <button class="back" onclick="home()">← KEMBALI</button>
            <h2>Mods</h2><div id="modlist"></div>
          </div>
          <div id="versions" class="panel">
            <button class="back" onclick="home()">← KEMBALI</button>
            <h2>Versi Minecraft</h2><div id="versionlist"></div>
          </div>
          <div id="resources" class="panel">
            <button class="back" onclick="home()">← KEMBALI</button>
            <h2>Resource Pack</h2><div id="resourcelist"></div>
          </div>
          <div id="shaders" class="panel">
            <button class="back" onclick="home()">← KEMBALI</button>
            <h2>Shader</h2><div id="shaderlist"></div>
          </div>

          <div id="settings" class="panel">
            <button class="back" onclick="home()">← KEMBALI</button>
            <h2>Settings</h2>
            <label>Graphics Renderer</label>
            <select><option>MobileGlues</option></select>
            <label>Java Runtime</label>
            <select>
              <option>Java 8</option><option>Java 17</option>
              <option>Java 21</option><option>Java 25</option>
            </select>
            <label>RAM Allocation</label>
            <input type="range" min="512" max="8192" value="2048">
            <h3>Mouse Settings</h3>
            <label>Ukuran Mouse</label>
            <input type="range" min="10" max="100" value="40">
            <label>Kecepatan Mouse</label>
            <input type="range" min="1" max="100" value="50">
            <label>Sensitivitas</label>
            <input type="range" min="1" max="100" value="50">
          </div>

          <div id="controller" class="panel">
            <button class="back" onclick="home()">← KEMBALI</button>
            <h2>Custom Controller</h2>
            <p class="note">Geser tombol untuk mengubah posisinya.</p>
            <div class="controller" id="area">
              <div class="joy"><div class="stick"></div></div>
              <div class="ctrl jump movable">J</div>
              <div class="ctrl attack movable">A</div>
              <div class="ctrl sneak movable">S</div>
            </div>
            <label>Ukuran Tombol</label>
            <input type="range" min="25" max="90" value="48" oninput="resizeButtons(this.value)">
            <label>Transparansi</label>
            <input type="range" min="20" max="100" value="100" oninput="opacityButtons(this.value)">
            <button onclick="alert('Layout controller tersimpan sementara.')">SIMPAN LAYOUT</button>
          </div>
          </main>

          <script>
          const catalogs={
            modlist:['Sodium','Lithium','FerriteCore','Mod Menu'],
            versionlist:['1.21.11','1.21.10','1.21.8','1.20.1'],
            resourcelist:['Faithful','Bare Bones','Classic 3D'],
            shaderlist:['Complementary','BSL Shader','Sildur']
          };
          for(const id in catalogs){
            document.getElementById(id).innerHTML=catalogs[id].map(n=>
              `<div class="item"><span>${n}</span><button onclick="install(this)">INSTAL</button></div>`
            ).join('');
          }
          function install(btn){
            btn.textContent='TERINSTAL';
            btn.style.background='#287b4c';
            btn.disabled=true;
            alert('Simulasi instalasi. File Minecraft belum benar-benar dipasang.');
          }
          function openPage(id){
            document.getElementById('home').style.display='none';
            document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
          }
          function home(){
            document.getElementById('home').style.display='block';
            document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
          }
          function loadSkin(e){
            if(e.target.files[0]){
              document.getElementById('skin').innerHTML='';
              document.getElementById('skin').style.backgroundImage='url('+URL.createObjectURL(e.target.files[0])+')';
              document.getElementById('skin').style.backgroundSize='cover';
            }
          }
          function resizeButtons(v){
            document.querySelectorAll('.ctrl').forEach(b=>{
              b.style.width=v+'px';b.style.height=v+'px';
            });
          }
          function opacityButtons(v){
            document.querySelectorAll('.ctrl,.joy').forEach(b=>b.style.opacity=v/100);
          }
          document.querySelectorAll('.movable').forEach(el=>{
            let drag=false,dx=0,dy=0;
            el.onpointerdown=e=>{
              drag=true;
              const r=el.getBoundingClientRect();
              dx=e.clientX-r.left;dy=e.clientY-r.top;
              el.setPointerCapture(e.pointerId);
            };
            el.onpointermove=e=>{
              if(!drag)return;
              const r=document.getElementById('area').getBoundingClientRect();
              el.style.left=(e.clientX-r.left-dx)+'px';
              el.style.top=(e.clientY-r.top-dy)+'px';
              el.style.right='auto';el.style.bottom='auto';
            };
            el.onpointerup=()=>drag=false;
          });
          </script>
          </body>
          </html>
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug

      - name: Upload AUTHER APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTHER-LAUNCHER-V0.1
          path: app/build/outputs/apk/debug/app-debug.apk
