
name: Build AUTHER Playable APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build AUTHER Minecraft Java
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout AUTHER
        uses: actions/checkout@v4

      - name: Download Minecraft Launcher Engine
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-Android
          ref: v3_openjdk
          path: engine
          submodules: recursive

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Java 8 Runtime
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: engine/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Change App Name to AUTHER
        working-directory: engine
        run: |
          FILE="app_pojavlauncher/src/main/res/values/strings.xml"
          sed -i 's#<string name="app_name" translatable="false">Amethyst</string>#<string name="app_name" translatable="false">AUTHER</string>#' "$FILE"
          sed -i 's#<string name="app_short_name" translatable="false">Amethyst</string>#<string name="app_short_name" translatable="false">AUTHER</string>#' "$FILE"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      - name: Prepare Launcher
        working-directory: engine
        run: |
          chmod +x scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p out

      - name: Build AUTHER APK
        working-directory: engine
        run: |
          gradle --no-daemon :app_pojavlauncher:assembleDebug --stacktrace

      - name: Prepare APK
        working-directory: engine
        run: |
          mkdir -p out
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/AUTHER-debug.apk
          test -s out/AUTHER-debug.apk

      - name: Upload AUTHER APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTHER-Playable-Debug-APK
          path: engine/out/AUTHER-debug.apk
          if-no-files-found: error
          retention-days: 14
