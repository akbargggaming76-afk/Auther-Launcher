
name: Build AUTHER Launcher V0.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "platform-tools"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/auther/launcher

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AUTHERLauncher"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" > gradle.properties

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.auther.launcher'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.auther.launcher'
                  minSdk 26
                  targetSdk 28
                  versionCode 1
                  versionName '0.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="AUTHER Launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/auther/launcher/MainActivity.java <<'EOF'
          package com.auther.launcher;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().getDecorView().setSystemUiVisibility(
                      5894 | 1024 | 512 | 4096
                  );

                  web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);

                  web.setWebViewClient(new WebViewClient());
                  web.loadUrl("file:///android_asset/index.html");

                  setContentView(web);
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Create launcher interface
        run: |
          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="id">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>AUTHER Launcher</title>
          <style>
          *{box-sizing:border-box}
          body{
            margin:0;background:#101010;color:white;
            font-family:Arial,sans-serif;
            cursor:none;overflow:hidden
          }
          button,input{
            font:inherit
          }
          button{
            background:#a71919;color:white;border:1px solid #e23b3b;
            padding:10px 22px;border-radius:5px;cursor:none
          }
          input{
            width:100%;padding:12px;background:#202020;
            color:white;border:1px solid #555;border-radius:5px
          }
          .cursor{
            position:fixed;z-index:9999;pointer-events:none;
            color:#fff;font-size:21px;line-height:15px;
            transform:translate(-3px,-2px)
          }
          .cursor span{display:block;margin-left:5px}
          .app{display:flex;height:100vh}
          aside{
            width:180px;flex-shrink:0;background:#171717;
            border-right:2px solid #a71919;padding:15px
          }
          .logo{font-size:23px;font-weight:bold;color:#ef3737;margin-bottom:25px}
          .nav{
            display:block;width:100%;margin:8px 0;text-align:left;
            background:#222;border:0
          }
          .nav.active{background:#9d1717}
          main{flex:1;padding:22px;overflow:auto}
          .page{display:none}
          .page.active{display:block}
          h2{color:#ef4545}
          .home{
            height:85vh;display:flex;flex-direction:column;
            align-items:center;justify-content:center;
            background:linear-gradient(140deg,#281111,#111 60%,#351010);
            border-radius:10px
          }
          .play{min-width:125px;font-weight:bold;font-size:17px}
          .selected{margin-top:12px;color:#ccc}
          .columns{display:grid;grid-template-columns:1fr 260px;gap:18px}
          .panel{background:#1c1c1c;padding:15px;border-radius:8px}
          .item{
            background:#292929;margin:7px 0;padding:12px;
            border-radius:5px
          }
          .account{max-width:440px;margin:auto}
          .field{margin:14px 0}
          .field label{display:block;margin-bottom:7px}
          .center{text-align:center;margin-top:20px}
          .center button{min-width:115px}
          .muted{color:#aaa;font-size:12px}
          .row{display:flex;gap:8px;align-items:center}
          .row button{flex:1}
          .loading{
            position:fixed;inset:0;background:#111;
            display:none;align-items:center;justify-content:center;
            font-size:19px
          }
          .loading.show{display:flex}
          .status{color:#f5aaaa;margin-top:12px}
          @media(max-width:650px){
            aside{width:145px;padding:9px}
            main{padding:12px}
            .columns{grid-template-columns:1fr 190px}
          }
          </style>
          </head>
          <body>
          <div class="cursor" id="cursor">∆<span>|</span></div>

          <div class="app">
            <aside>
              <div class="logo">AUTHER</div>
              <button class="nav active" onclick="page('home',this)">Home</button>
              <button class="nav" onclick="page('download',this)">Download</button>
              <button class="nav" onclick="page('account',this)">Account</button>
              <button class="nav" onclick="page('settings',this)">Setting</button>
              <button class="nav" onclick="page('about',this)">Tentang</button>
            </aside>

            <main>
              <section class="page active" id="home">
                <div class="home">
                  <button class="play" onclick="playGame()">PLAY</button>
                  <div class="selected" id="selectedVersion">
                    Belum ada versi terpasang
                  </div>
                  <div class="status" id="playStatus"></div>
                </div>
              </section>

              <section class="page" id="download">
                <h2>Download</h2>
                <div class="columns">
                  <div class="panel">
                    <h3 id="categoryTitle">Version & Loader</h3>
                    <div id="catalog">
                      Pilih kategori di sebelah kanan.
                    </div>
                    <div class="row">
                      <button onclick="resetCatalog()">Remove</button>
                      <button onclick="nextCatalog()">Next</button>
                    </div>
                  </div>
                  <div class="panel">
                    <button class="nav active" onclick="category('Version & Loader')">Version & Loader</button>
                    <button class="nav" onclick="category('Mods')">Mods</button>
                    <button class="nav" onclick="category('Shader')">Shader</button>
                    <button class="nav" onclick="category('Worlds')">Worlds</button>
                    <button class="nav" onclick="category('Installed')">Installed</button>
                  </div>
                </div>
              </section>

              <section class="page" id="account">
                <h2>Account</h2>
                <div class="account panel">
                  <div class="row">
                    <button onclick="accountType('offline')">Offline</button>
                    <button onclick="accountType('ely')">Ely.by</button>
                    <button onclick="accountType('microsoft')">Microsoft</button>
                  </div>
                  <div id="accountForm" style="margin-top:22px">
                    Pilih jenis akun.
                  </div>
                </div>
              </section>

              <section class="page" id="settings">
                <h2>Setting</h2>
                <div class="panel">
                  <div class="item">Renderer Cuality</div>
                  <div class="item">Custome controller</div>
                  <div class="item">mouse setting</div>
                  <div class="item">Background</div>
                  <div class="item">Tentang</div>
                </div>
              </section>

              <section class="page" id="about">
                <h2>Tentang</h2>
                <div class="panel">
                  <p>AUTHER Launcher V0.1</p>
                  <p>Dibuat oleh</p>
                  <b>YuzeeCraft</b>
                  <p><a style="color:#f55" href="https://whatsapp.com/channel/0029VbEhRzO4IBhBLF0U5K0t">Cek pembaruan</a></p>
                </div>
              </section>
            </main>
          </div>

          <div class="loading" id="loading">
            O • Tunggu logo mojang muncul
          </div>

          <script>
          let currentCategory='Version & Loader';
          let currentAccount='';

          document.addEventListener('mousemove',e=>{
            const c=document.getElementById('cursor');
            c.style.left=e.clientX+'px';
            c.style.top=e.clientY+'px';
          });

          function page(id,btn){
            document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('aside .nav').forEach(b=>b.classList.remove('active'));
            if(btn)btn.classList.add('active');
          }

          function category(name){
            currentCategory=name;
            document.getElementById('categoryTitle').textContent=name;
            document.getElementById('catalog').textContent=
              name==='Installed'?'Versi terpasang akan ditampilkan di sini.':
              'Pilih dan cari '+name+'. Katalog dan instalasi nyata memerlukan integrasi sumber dan penyimpanan native.';
          }

          function resetCatalog(){category(currentCategory)}
          function nextCatalog(){category(currentCategory)}

          function accountType(type){
            currentAccount=type;
            let html='';
            if(type==='offline'){
              html='<h3>Offline account</h3>'+
              '<div class="field"><label>Name :</label>'+
              '<input id="playerName" placeholder="Masukkan nama" maxlength="16">'+
              '<div class="muted">Minimal 3–16 karakter</div></div>'+
              '<div class="center"><button onclick="offlineLogin()">Masuk</button></div>';
            }else if(type==='ely'){
              html='<h3>Ely.by account</h3>'+
              '<div class="field"><label>Email :</label><input id="elyEmail" type="email" placeholder="Masukkan email"></div>'+
              '<div class="field"><label>Password :</label><input id="elyPassword" type="password" placeholder="Masukkan Password"></div>'+
              '<div class="center"><button onclick="elyLogin()">Masuk</button></div>';
            }else{
              html='<h3>Microsoft account</h3>'+
              '<div class="field"><label>Email :</label><input id="msEmail" type="email" placeholder="Masukkan email"></div>'+
              '<div class="field"><label>Password :</label><input id="msPassword" type="password" placeholder="Masukkan Password"></div>'+
              '<div class="center"><button onclick="msLogin()">Masuk</button></div>'+
              '<p class="muted">Login Microsoft harus diselesaikan melalui autentikasi resmi Microsoft.</p>';
            }
            document.getElementById('accountForm').innerHTML=html;
          }

          function offlineLogin(){
            const name=document.getElementById('playerName').value.trim();
            if(!/^[A-Za-z0-9_]{3,16}$/.test(name)){
              alert('Nama harus 3–16 karakter: huruf, angka, atau garis bawah.');
              return;
            }
            alert('Profil offline dibuat: '+name);
          }

          function elyLogin(){
            alert('Login Ely.by belum terhubung ke layanan autentikasi.');
          }

          function msLogin(){
            alert('Login Microsoft resmi OAuth belum diintegrasikan.');
          }

          function playGame(){
            document.getElementById('loading').classList.add('show');
            setTimeout(()=>{
              document.getElementById('loading').classList.remove('show');
              document.getElementById('playStatus').textContent=
                'Minecraft Java Runtime belum terintegrasi. Game belum dapat dijalankan.';
            },1800);
          }
          </script>
          </body>
          </html>
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTHER-Launcher-V0.1
          path: app/build/outputs/apk/debug/app-debug.apk
