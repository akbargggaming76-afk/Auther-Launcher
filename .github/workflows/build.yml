
name: AUTHER Launcher Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build AUTHER Launcher V0.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/auther/launcher

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'AUTHER'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.auther.launcher'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.auther.launcher'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '0.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="AUTHER Launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/auther/launcher/MainActivity.java <<'EOF'
          package com.auther.launcher;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import java.io.InputStream;

          public class MainActivity extends Activity {

              int bg = Color.rgb(17,19,27);
              int panel = Color.rgb(32,36,49);
              int green = Color.rgb(120,184,92);
              int red = Color.rgb(220,85,91);
              int orange = Color.rgb(237,152,78);
              int white = Color.WHITE;

              LinearLayout root;
              ImageView avatar;
              TextView playerName;
              TextView status;

              int dp(float n) {
                  return (int)(n * getResources()
                      .getDisplayMetrics().density);
              }

              TextView label(String value, int size, int color) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  return t;
              }

              GradientDrawableBox drawable(int color, int radius) {
                  return new GradientDrawableBox(color, dp(radius));
              }

              class GradientDrawableBox
                  extends android.graphics.drawable.GradientDrawable {
                  GradientDrawableBox(int color, int radius) {
                      setColor(color);
                      setCornerRadius(radius);
                  }
              }

              LinearLayout card() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setBackground(drawable(panel, 16));
                  return box;
              }

              Button menuButton(String title) {
                  Button b = new Button(this);
                  b.setText(title + "     ›");
                  b.setTextColor(white);
                  b.setTextSize(18);
                  b.setAllCaps(false);
                  b.setGravity(Gravity.CENTER_VERTICAL);
                  b.setPadding(dp(20), 0, dp(18), 0);
                  b.setBackgroundTintList(
                      android.content.res.ColorStateList.valueOf(
                          Color.rgb(48,65,45)));
                  return b;
              }

              void showMenu(String name) {
                  String message;

                  switch(name) {
                      case "Mods":
                          message = "Pengelola Mods AUTHER.\\nFitur impor dan pengelolaan mod sedang dikembangkan.";
                          break;
                      case "Versi Minecraft":
                          message = "Pengelola versi Minecraft.\\nPengunduh versi dan pemasangan game belum terintegrasi.";
                          break;
                      case "Resource Pack":
                          message = "Pengelola Resource Pack.\\nFitur impor pack sedang dikembangkan.";
                          break;
                      default:
                          message = "Pengelola Shader.\\nDukungan shader sedang dikembangkan.";
                  }

                  new AlertDialog.Builder(this)
                      .setTitle(name)
                      .setMessage(message)
                      .setPositiveButton("TUTUP", null)
                      .show();
              }

              void importSkin() {
                  Intent intent = new Intent(
                      Intent.ACTION_OPEN_DOCUMENT);
                  intent.setType("image/*");
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  startActivityForResult(intent, 100);
              }

              @Override
              protected void onActivityResult(
                  int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(
                      requestCode, resultCode, data);

                  if(requestCode == 100 &&
                     resultCode == RESULT_OK && data != null) {
                      Uri uri = data.getData();
                      try {
                          InputStream stream =
                              getContentResolver().openInputStream(uri);
                          Bitmap bitmap =
                              BitmapFactory.decodeStream(stream);
                          stream.close();

                          if(bitmap != null) {
                              avatar.setImageBitmap(bitmap);
                              avatar.setScaleType(
                                  ImageView.ScaleType.CENTER_CROP);
                              Toast.makeText(this,
                                  "Gambar skin berhasil dimuat",
                                  Toast.LENGTH_SHORT).show();
                          }
                      } catch(Exception e) {
                          Toast.makeText(this,
                              "Gagal membuka gambar",
                              Toast.LENGTH_SHORT).show();
                      }
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(bg);
                  getWindow().setNavigationBarColor(bg);
                  home();
              }

              void home() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(22), dp(15), dp(22), dp(12));
                  root.setBackgroundColor(bg);

                  LinearLayout content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.HORIZONTAL);

                  // LEFT SIDE
                  LinearLayout left = new LinearLayout(this);
                  left.setOrientation(LinearLayout.VERTICAL);

                  LinearLayout profile = new LinearLayout(this);
                  profile.setGravity(Gravity.CENTER_VERTICAL);

                  avatar = new ImageView(this);
                  avatar.setImageResource(
                      android.R.drawable.sym_def_app_icon);
                  avatar.setBackground(drawable(red, 14));
                  avatar.setPadding(dp(5), dp(5), dp(5), dp(5));
                  avatar.setScaleType(
                      ImageView.ScaleType.CENTER_CROP);

                  profile.addView(avatar,
                      new LinearLayout.LayoutParams(dp(75), dp(75)));

                  LinearLayout nameBox = new LinearLayout(this);
                  nameBox.setOrientation(LinearLayout.VERTICAL);
                  nameBox.setPadding(dp(12), 0, 0, 0);

                  playerName = label("AUTHER", 25, white);
                  playerName.setTypeface(null, Typeface.BOLD);

                  TextView subtitle =
                      label("Minecraft Java Edition", 13,
                          Color.LTGRAY);

                  nameBox.addView(playerName);
                  nameBox.addView(subtitle);

                  profile.addView(nameBox);
                  left.addView(profile);

                  Button skin = new Button(this);
                  skin.setText("▧  IMPOR SKIN");
                  skin.setTextSize(17);
                  skin.setAllCaps(false);
                  skin.setTextColor(white);
                  skin.setBackgroundTintList(
                      android.content.res.ColorStateList.valueOf(
                          orange));
                  skin.setOnClickListener(v -> importSkin());

                  LinearLayout.LayoutParams skinParams =
                      new LinearLayout.LayoutParams(-1, 0, 1);
                  skinParams.setMargins(0, dp(18), dp(12), 0);
                  left.addView(skin, skinParams);

                  // RIGHT SIDE
                  LinearLayout right = new LinearLayout(this);
                  right.setOrientation(LinearLayout.VERTICAL);
                  right.setBackground(drawable(
                      Color.rgb(35,57,39), 16));
                  right.setPadding(dp(5), dp(5), dp(5), dp(5));

                  String[] names = {
                      "Mods",
                      "Versi Minecraft",
                      "Resource Pack",
                      "Shader"
                  };

                  for(String name : names) {
                      Button b = menuButton(name);
                      b.setOnClickListener(v -> showMenu(name));

                      LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(-1, 0, 1);
                      p.setMargins(0, dp(3), 0, dp(3));
                      right.addView(b, p);
                  }

                  content.addView(left,
                      new LinearLayout.LayoutParams(0, -1, 1));

                  LinearLayout.LayoutParams rightParams =
                      new LinearLayout.LayoutParams(0, -1, 1);
                  rightParams.setMargins(dp(12), 0, 0, 0);
                  content.addView(right, rightParams);

                  root.addView(content,
                      new LinearLayout.LayoutParams(-1, 0, 1));

                  // PLAY BUTTON
                  Button play = new Button(this);
                  play.setText("▶  PLAY");
                  play.setTextSize(19);
                  play.setTypeface(null, Typeface.BOLD);
                  play.setTextColor(white);
                  play.setAllCaps(false);
                  play.setBackground(drawable(Color.BLACK, 40));

                  play.setOnClickListener(v ->
                      new AlertDialog.Builder(this)
                          .setTitle("AUTHER Launcher")
                          .setMessage(
                              "Minecraft Java Runtime belum terintegrasi.\\n\\nTombol PLAY sudah aktif, tetapi game belum dapat dijalankan.")
                          .setPositiveButton("OK", null)
                          .show()
                  );

                  LinearLayout.LayoutParams playParams =
                      new LinearLayout.LayoutParams(
                          (int)(getResources()
                              .getDisplayMetrics().widthPixels * 0.65),
                          dp(55));
                  playParams.gravity = Gravity.CENTER;
                  playParams.setMargins(0, dp(12), 0, 0);

                  root.addView(play, playParams);
                  setContentView(root);
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTHER-LAUNCHER-V0.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
