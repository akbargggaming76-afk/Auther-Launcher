
name: AUTHER Launcher V0.1 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build AUTHER Launcher V0.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Android Project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/auther/launcher

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AUTHERLauncher"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.auther.launcher'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.auther.launcher'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '0.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="AUTHER Launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/auther/launcher/MainActivity.java <<'EOF'
          package com.auther.launcher;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="id">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>AUTHER Launcher</title>
          <style>
          *{box-sizing:border-box}
          body{margin:0;background:#100b10;color:white;font-family:Arial}
          header{height:60px;background:#171117;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;border-bottom:2px solid #bd2935}
          .logo{font-size:24px;font-weight:900;color:#ff424b;letter-spacing:3px}
          button{background:#a92130;color:white;border:0;border-radius:8px;padding:12px 18px;font-weight:bold}
          nav{display:flex;gap:8px}
          main{min-height:calc(100vh - 60px);padding:20px;background:linear-gradient(#0005,#0009),radial-gradient(ellipse at 50% 100%,#842b36,#24121c 65%,#100b10)}
          .panel{max-width:650px;margin:30px auto;text-align:center;background:#100b10c9;border:1px solid #b52c39;border-radius:15px;padding:25px}
          h1{font-size:45px;color:#ff414b;margin:10px}
          h2{letter-spacing:5px}
          .play{width:100%;font-size:23px;padding:18px;margin-top:20px}
          .version{margin-top:15px;font-weight:bold}
          .section{max-width:650px;margin:25px auto;background:#19131a;padding:20px;border-radius:12px}
          .item{display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid #49313a}
          select,input{padding:10px;background:#29202a;color:white;border:1px solid #a52b39;border-radius:7px}
          .hidden{display:none}
          </style>
          </head>
          <body>
          <header>
          <div class="logo">AUTHER</div>
          <nav>
          <button onclick="page('home')">HOME</button>
          <button onclick="page('download')">UNDUH</button>
          <button onclick="page('settings')">SETTING</button>
          </nav>
          </header>
          <main>
          <section id="home">
          <div class="panel">
          <h1>AUTHER</h1>
          <h2>LAUNCHER</h2>
          <p>Minecraft Java Edition</p>
          <button class="play" onclick="play()">▶ PLAY</button>
          <div class="version" id="versionText">Minecraft 1.21 | Fabric 0.19.5</div>
          </div>
          </section>
          <section id="download" class="hidden">
          <div class="section">
          <h2>UNDUH</h2>
          <div id="categories"></div>
          </div>
          <div class="section hidden" id="versionPanel">
          <h3>Versi Minecraft</h3>
          <select id="mc"><option>1.21</option><option>1.20.6</option><option>1.20.4</option><option>1.19.4</option></select>
          <h3>Loader</h3>
          <select id="loader"><option>Vanilla</option><option>Fabric 0.19.5</option><option>Forge</option><option>NeoForge</option><option>Quilt</option></select>
          <br><br>
          <button onclick="installVersion()">INSTAL</button>
          </div>
          </section>
          <section id="settings" class="hidden">
          <div class="section">
          <h2>SETTING</h2>
          <p>Ganti Background</p>
          <input type="file" accept="image/*" onchange="wallpaper(event)">
          <p>Renderer</p>
          <select><option>MobileGlues</option></select>
          <p>Java Runtime</p>
          <select><option>Java 8</option><option>Java 17</option><option>Java 21</option><option>Java 25</option></select>
          <p>RAM</p>
          <select><option>1024 MB</option><option>2048 MB</option><option>4096 MB</option></select>
          </div>
          </section>
          </main>
          <script>
          function page(id){
          ['home','download','settings'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));
          }
          ['Source All','Version','Mods','Resource','Shader','Worlds'].forEach(name=>{
          let div=document.createElement('div');
          div.className='item';
          let label=document.createElement('span');
          label.textContent=name;
          let btn=document.createElement('button');
          btn.textContent='BUKA';
          btn.onclick=()=>{
          document.getElementById('versionPanel').classList.toggle('hidden',name!=='Version');
          if(name!=='Version') alert('Katalog '+name+' belum terhubung.');
          };
          div.append(label,btn);
          document.getElementById('categories').append(div);
          });
          function installVersion(){
          document.getElementById('versionText').textContent='Minecraft '+document.getElementById('mc').value+' | '+document.getElementById('loader').value;
          alert('Pilihan versi disimpan. Instalasi game belum terhubung.');
          page('home');
          }
          function wallpaper(e){
          if(!e.target.files[0])return;
          let url=URL.createObjectURL(e.target.files[0]);
          document.querySelector('main').style.background='linear-gradient(#0005,#0009),url('+url+') center/cover';
          }
          function play(){
          alert('Engine Minecraft Java belum terintegrasi. PLAY belum dapat menjalankan game.');
          }
          </script>
          </body>
          </html>
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTHER-LAUNCHER-V0.1
          path: app/build/outputs/apk/debug/app-debug.apk
