
name: Build AUTHER Launcher V0.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept SDK Licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          RESULT=${PIPESTATUS[1]}
          if [ "$RESULT" -ne 0 ]; then
            echo "SDK license acceptance failed"
            exit "$RESULT"
          fi

      - name: Install SDK Packages
        shell: bash
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          adb version
          echo "SDK READY"

      - name: Check Gradle Project
        shell: bash
        run: |
          test -f gradlew
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Setup Gradle Permission
        run: chmod +x gradlew

      - name: Build AUTHER Launcher APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTHER-Launcher-V0.1
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
