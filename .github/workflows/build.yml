
name: AUTHER Launcher V0.1 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build AUTHER Launcher APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ANDROID SDK INSTALLATION

      - name: Prepare Android SDK
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android Command Line Tools
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y curl unzip

          mkdir -p /tmp/android-command-tools

          curl -fL --retry 5 --retry-delay 5 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o /tmp/android-command-tools.zip

          unzip -q /tmp/android-command-tools.zip \
            -d /tmp/android-command-tools

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          cp -R /tmp/android-command-tools/cmdline-tools/. \
            "$ANDROID_HOME/cmdline-tools/latest/"

          chmod -R a+rX "$ANDROID_HOME/cmdline-tools/latest"

          test -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

      - name: Check SDK Manager
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" --licenses

      - name: Install Android SDK Packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "Android SDK berhasil disiapkan."

      # GRADLE

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ANDROID PROJECT

      - name: Create AUTHER Android Project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/auther/launcher
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AUTHERLauncher"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.auther.launcher'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.auther.launcher'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '0.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="AUTHER Launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/auther/launcher/MainActivity.java <<'EOF'
          package com.auther.launcher;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.ValueCallback;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {

                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }

                          fileCallback = callback;

                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("image/*");

                          startActivityForResult(
                              Intent.createChooser(intent, "Pilih Wallpaper"),
                              1001
                          );

                          return true;
                      }
                  });

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == 1001 && fileCallback != null) {
                      Uri[] result = null;

                      if (resultCode == RESULT_OK &&
                              data != null &&
                              data.getData() != null) {
                          result = new Uri[]{data.getData()};
                      }

                      fileCallback.onReceiveValue(result);
                      fileCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      # AUTHER LAUNCHER HTML

      - name: Create AUTHER Launcher Interface
        shell: bash
        run: |
          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="id">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>AUTHER Launcher V0.1</title>

          <style>
          *{box-sizing:border-box}

          body{
            margin:0;
            background:#100b12;
            color:white;
            font-family:Arial,sans-serif;
          }

          header{
            height:65px;
            background:#171018;
            border-bottom:2px solid #d52c3d;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 20px;
          }

          .logo{
            font-size:24px;
            font-weight:bold;
            color:#ff394b;
            letter-spacing:3px;
          }

          nav{display:flex;gap:7px}

          button{
            background:#30212b;
            color:white;
            border:1px solid #a52e42;
            padding:11px 15px;
            border-radius:7px;
            font-weight:bold;
          }

          button:active{background:#c52e40}

          main{
            min-height:calc(100vh - 65px);
            padding:20px;
            background:
              linear-gradient(#160b16aa,#100810dd),
              radial-gradient(ellipse at bottom,#a52c42,#321526 65%,#100b12);
            background-size:cover;
            background-position:center;
          }

          .page{max-width:850px;margin:auto}
          .hidden{display:none!important}

          .hero{
            margin:50px auto 0;
            max-width:600px;
            text-align:center;
            padding:35px 20px;
            background:#130d16d9;
            border:1px solid #a52e42;
            border-radius:15px;
          }

          h1{
            font-size:48px;
            color:#ff4050;
            letter-spacing:5px;
            margin:10px;
          }

          .play{
            width:100%;
            max-width:400px;
            margin-top:25px;
            background:#c52d40;
            font-size:24px;
            padding:17px;
          }

          .version{margin-top:15px;color:#ddd}

          .panel{
            background:#19121c;
            padding:20px;
            margin:20px auto;
            border:1px solid #74303e;
            border-radius:12px;
          }

          .item{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
            padding:15px 0;
            border-bottom:1px solid #44303a;
          }

          select,input{
            background:#29202d;
            color:white;
            padding:11px;
            border:1px solid #994052;
            border-radius:6px;
            max-width:100%;
          }

          label{display:block;margin:15px 0 7px}
          </style>
          </head>

          <body>

          <header>
            <div class="logo">AUTHER</div>
            <nav>
              <button onclick="showPage('home')">HOME</button>
              <button onclick="showPage('download')">UNDUH</button>
              <button onclick="showPage('settings')">SETTING</button>
            </nav>
          </header>

          <main id="background">

          <section id="home" class="page">
            <div class="hero">
              <h1>AUTHER</h1>
              <h2>LAUNCHER</h2>
              <p>MINECRAFT JAVA EDITION</p>

              <button class="play" onclick="playGame()">▶ PLAY</button>

              <div class="version" id="selectedVersion">
                Minecraft 1.21 | Fabric 0.19.5
              </div>
            </div>
          </section>

          <section id="download" class="page hidden">
            <div class="panel">
              <h2>UNDUH</h2>
              <div id="categories"></div>
            </div>

            <div class="panel hidden" id="versionPanel">
              <h2>VERSION MANAGER</h2>

              <label>Minecraft Version</label>
              <select id="mcVersion">
                <option>1.21</option>
                <option>1.20.6</option>
                <option>1.20.4</option>
                <option>1.19.4</option>
              </select>

              <label>Loader</label>
              <select id="loader">
                <option>Vanilla</option>
                <option>Fabric 0.19.5</option>
                <option>Forge</option>
                <option>NeoForge</option>
                <option>Quilt</option>
              </select>

              <p>
                <button onclick="installVersion()">SIMPAN PILIHAN</button>
              </p>

              <p id="installStatus">Belum ada instalasi.</p>
            </div>
          </section>

          <section id="settings" class="page hidden">
            <div class="panel">
              <h2>SETTING</h2>

              <label>Ganti Wallpaper</label>
              <input type="file" accept="image/*"
                onchange="changeBackground(event)">

              <label>Renderer</label>
              <select>
                <option>MobileGlues</option>
              </select>

              <label>Java Runtime</label>
              <select>
                <option>Java 8</option>
                <option>Java 17</option>
                <option>Java 21</option>
                <option>Java 25</option>
              </select>

              <label>RAM</label>
              <select>
                <option>1024 MB</option>
                <option>2048 MB</option>
                <option>4096 MB</option>
              </select>
            </div>
          </section>

          </main>

          <script>
          function showPage(page){
            ['home','download','settings'].forEach(id=>{
              document.getElementById(id)
                .classList.toggle('hidden',id!==page);
            });
          }

          const categories=[
            'Source All','Version','Mods',
            'Resource','Shader','Worlds'
          ];

          const container=document.getElementById('categories');

          categories.forEach(name=>{
            const row=document.createElement('div');
            row.className='item';

            const title=document.createElement('span');
            title.textContent=name;

            const btn=document.createElement('button');
            btn.textContent='BUKA';

            btn.onclick=()=>{
              const panel=document.getElementById('versionPanel');
              panel.classList.toggle('hidden',name!=='Version');

              if(name!=='Version'){
                alert('Katalog '+name+' belum terhubung.');
              }
            };

            row.append(title,btn);
            container.appendChild(row);
          });

          function installVersion(){
            const version=document.getElementById('mcVersion').value;
            const loader=document.getElementById('loader').value;

            document.getElementById('selectedVersion').textContent=
              'Minecraft '+version+' | '+loader;

            document.getElementById('installStatus').textContent=
              'Pilihan tersimpan. File Minecraft belum diinstal.';

            showPage('home');
          }

          function changeBackground(event){
            const file=event.target.files[0];
            if(!file)return;

            const reader=new FileReader();

            reader.onload=()=>{
              document.getElementById('background').style.backgroundImage=
                'linear-gradient(#160b16aa,#100810dd),url("'+
                reader.result+'")';
            };

            reader.readAsDataURL(file);
          }

          function playGame(){
            alert(
              'Minecraft Java belum dapat dijalankan. '+
              'Engine Minecraft Java perlu diintegrasikan terlebih dahulu.'
            );
          }
          </script>

          </body>
          </html>
          EOF

      # BUILD APK

      - name: Build AUTHER Launcher
        shell: bash
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AUTHER Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTHER-LAUNCHER-V0.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
