
name: AUTHER Launcher Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build AUTHER Launcher V0.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/auther/launcher

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'AUTHER'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.auther.launcher'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.auther.launcher'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '0.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="AUTHER Launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="sensorLandscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/auther/launcher/MainActivity.java <<'EOF'
          package com.auther.launcher;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.content.res.ColorStateList;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;

          public class MainActivity extends Activity {

              int bg = Color.rgb(19, 21, 30);
              int panel = Color.rgb(35, 39, 53);
              int accent = Color.rgb(95, 115, 255);
              LinearLayout root;

              int dp(float value) {
                  return (int)(value * getResources().getDisplayMetrics().density);
              }

              TextView text(String value, int size, int color) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  return t;
              }

              LinearLayout card(String heading, String detail) {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setGravity(Gravity.CENTER_VERTICAL);
                  box.setPadding(dp(22), dp(18), dp(22), dp(18));
                  box.setBackgroundColor(panel);

                  TextView title = text(heading, 20, Color.WHITE);
                  title.setTypeface(null, Typeface.BOLD);

                  TextView description = text(detail, 14,
                      Color.rgb(185, 190, 205));
                  description.setPadding(0, dp(10), 0, 0);

                  box.addView(title);
                  box.addView(description);

                  return box;
              }

              Button button(String label, int color) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(15);
                  b.setTextColor(Color.WHITE);
                  b.setAllCaps(false);
                  b.setBackgroundTintList(
                      ColorStateList.valueOf(color));
                  return b;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(bg);
                  getWindow().setNavigationBarColor(bg);

                  home();
              }

              void home() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(28), dp(20), dp(28), dp(20));
                  root.setBackgroundColor(bg);

                  // HEADER
                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.VERTICAL);

                  TextView logo = text("Ⓐ AUTHER", 30, Color.WHITE);
                  logo.setTypeface(null, Typeface.BOLD);

                  TextView subtitle = text(
                      "Minecraft Java Edition", 15,
                      Color.rgb(190, 195, 210));

                  header.addView(logo);
                  header.addView(subtitle);

                  root.addView(header);

                  // ACCOUNT AND VERSION CARDS
                  LinearLayout content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.HORIZONTAL);
                  content.setPadding(0, dp(24), 0, dp(20));

                  LinearLayout account = card(
                      "AKUN",
                      "Belum ada akun\\nKetuk untuk mengelola akun"
                  );

                  LinearLayout version = card(
                      "VERSI MINECRAFT",
                      "Belum ada versi terpasang\\nPilih versi Minecraft"
                  );

                  LinearLayout.LayoutParams cardParams =
                      new LinearLayout.LayoutParams(0,
                          -1, 1);

                  cardParams.setMargins(0, 0, dp(12), 0);
                  content.addView(account, cardParams);

                  LinearLayout.LayoutParams versionParams =
                      new LinearLayout.LayoutParams(0,
                          -1, 1);

                  versionParams.setMargins(dp(12), 0, 0, 0);
                  content.addView(version, versionParams);

                  root.addView(content,
                      new LinearLayout.LayoutParams(-1, 0, 1));

                  // SETTINGS
                  LinearLayout settings = new LinearLayout(this);
                  settings.setOrientation(LinearLayout.HORIZONTAL);
                  settings.setGravity(Gravity.CENTER_VERTICAL);

                  TextView settingText = text(
                      "Pengaturan     RAM     Java     Mods     Resource Packs",
                      13, Color.LTGRAY);

                  settings.addView(settingText);
                  root.addView(settings,
                      new LinearLayout.LayoutParams(-1, dp(42)));

                  // PLAY BUTTON
                  Button play = button("LUNCURKAN", accent);
                  play.setTextSize(18);
                  play.setTypeface(null, Typeface.BOLD);

                  play.setOnClickListener(v ->
                      Toast.makeText(this,
                          "Minecraft Java Runtime belum terintegrasi",
                          Toast.LENGTH_LONG).show()
                  );

                  root.addView(play,
                      new LinearLayout.LayoutParams(-1, dp(58)));

                  setContentView(root);
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTHER-LAUNCHER-V0.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
