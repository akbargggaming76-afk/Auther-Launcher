
name: Build AUTHER Launcher V0.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # EXTRACT PROJECT
      - name: Extract AUTHER Project
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          unzip -o AutherLauncher_0.1.zip -d extracted
          echo "Project berhasil diekstrak"

      # ANDROID SDK
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e
          SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "$SDK_PATH/platform-tools" >> "$GITHUB_PATH"
          test -d "$SDK_PATH"

      - name: Locate SDK Manager
        shell: bash
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android Licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail

      - name: Install Android SDK
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          adb version
          test -d "$ANDROID_HOME/platforms/android-35"
          echo "ANDROID SDK READY"

      # FIND PROJECT
      - name: Find AUTHER Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="extracted/AutherLauncher"

          test -f "$PROJECT_DIR/settings.gradle" || \
          test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" || \
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "AUTHER PROJECT FOUND"

      # INSTALL GRADLE WITHOUT WRAPPER
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle
        run: gradle --version

      # BUILD APK
      - name: Build AUTHER Launcher
        working-directory: extracted/AutherLauncher
        shell: bash
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      # CHECK APK
      - name: Check APK
        shell: bash
        run: |
          find extracted/AutherLauncher/app/build/outputs/apk \
            -name "*.apk" -type f
          test -n "$(find extracted/AutherLauncher/app/build/outputs/apk/debug \
            -name '*.apk' -type f -print -quit)"

      # UPLOAD APK
      - name: Upload AUTHER APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTHER-Launcher-V0.1
          path: extracted/AutherLauncher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
