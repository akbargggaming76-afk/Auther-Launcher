
name: Test AUTHER Launcher V0.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-build:
    name: Build and Test AUTHER
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept SDK Licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail

      - name: Install SDK Packages
        shell: bash
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify SDK
        run: |
          java -version
          sdkmanager --version
          adb version

      - name: Check Project Files
        run: |
          test -f gradlew
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Setup Gradle
        run: chmod +x gradlew

      - name: Test Gradle Configuration
        run: ./gradlew tasks --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Check APK
        shell: bash
        run: |
          find app/build/outputs/apk -name "*.apk" -type f
          test -n "$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTHER-Launcher-V0.1-TEST
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
